[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravityhunter-core"
version = "0.1.0"
description = "DSP analysis core for GravityHunter"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "streamlit>=1.35",
]

[tool.setuptools.packages.find]
include = ["gravityhunter*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
